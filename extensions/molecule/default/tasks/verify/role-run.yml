# Ensure developers add expected values for new OSes/versions.
- name: "Molecule | Verify | Fail if platform not in permission verification matrix"
  ansible.builtin.fail:
    msg: |
      Platform '{{ __testing_platform_key }}' is not ansible.builtin.defined in the permission verification matrix.

      To add support for this platform:
      1. If not already done: Run the tests with --destroy="never"
      2. Log into the failed container: molecule login --host={{ inventory_hostname }}
      3. Purge openssh and remove config directories:
         - Debian/Ubuntu specific:
           apt purge -y openssh-server
         - Red Hat/Fedora specific:
           dnf remove -y openssh-server
         - SUSE specific:
           zypper remove -y openssh-server
         - All:
           rm -rf /etc/ssh /usr/etc/ssh
      4. Reinstall openssh-server:
         - Debian/Ubuntu:
           apt update && apt install -y openssh-server
         - Red Hat/Fedora:
           dnf install -y openssh-server
         - SUSE:
           zypper install -y openssh-server
      5. Restart sshd (may (re)create privilege separation dir):
         systemctl restart sshd.service
      6. Check the default permissions.
         - Files on platforms:
           stat -c '%a %n' /etc/ssh/sshd_config /etc/ssh/sshd_config.d /etc/ssh/ssh_host_*_key 2>/dev/null
         - And the platform specific ones:
           - Red Hat/Fedora specific:
             stat -c '%a %n' /usr/share/empty.sshd 2>/dev/null
           - Debian/Ubuntu specific:
             stat -c '%a %n' /run/sshd 2>/dev/null
           - openSUSE specific:
             stat -c '%a %n' /usr/etc/ssh/sshd_config 2>/dev/null
             stat -c '%a %n' /var/lib/empty 2>/dev/null
      7. Add the values to __testing_os_permission_matrix above.
  when:
    - __testing_platform_key not in __testing_os_permission_matrix.keys()


- name: "Molecule | Verify | Build permission verification list"
  ansible.builtin.set_fact:
    __testing_permissions: |
      {% set items = [] %}
      {% for i in range(__testing_paths_to_verify | ansible.builtin.length) %}
      {%   set spec = __testing_paths_to_verify[i] %}
      {%   set result = __testing_stat_results['results'][i] %}
      {%   if result['stat']['exists'] | ansible.builtin.default(false) %}
      {%     set expected_mode_os = __testing_os_permission_matrix[__testing_platform_key][spec['os_matrix_key']]
               if spec['os_matrix_key'] else none %}
      {%     set _ = items.append({
               'path': spec['path'],
               'mode': result['stat']['mode'],
               'expected_mode_role': __testing_mode_map[spec['expected_mode_role']],
               'expected_mode_os': expected_mode_os,
               'owner': result['stat']['pw_name'] | ansible.builtin.default(''),
               'expected_owner': spec['expected_owner'] | ansible.builtin.default(''),
               'group': result['stat']['gr_name'] | ansible.builtin.default(''),
               'expected_group': spec['expected_group'] | ansible.builtin.default('')
             }) %}
      {%   endif %}
      {% endfor %}
      {{ items }}


- name: "Molecule | Verify | Assert permissions match role variables"
  ansible.builtin.assert:
    that:
      - item['mode'] == item['expected_mode_role']
      - item['owner'] == item['expected_owner'] or item['expected_owner'] == ''
      - item['group'] == item['expected_group'] or item['expected_group'] == ''
    fail_msg: >-
      {{ item['path'] }} permissions mismatch with role variables.
      Expected: mode={{ item['expected_mode_role'] }}, owner={{ item['expected_owner'] }}, group={{ item['expected_group'] }}.
      Got: mode={{ item['mode'] }}, owner={{ item['owner'] }}, group={{ item['group'] }}.
    success_msg: "{{ item['path'] }} OK ({{ item['mode'] }})"
  loop: "{{ __testing_permissions }}"
  loop_control:
    label: "{{ item['path'] }}"


- name: "Molecule | Verify | Assert permissions match OS defaults"
  ansible.builtin.assert:
    that:
      - item['mode'] == item['expected_mode_os']
    fail_msg: >-
      {{ item['path'] }} mode differs from OS default!
      Current: {{ item['mode'] }}. OS default ({{ __testing_platform_key }}): {{ item['expected_mode_os'] }}.
      Update role vars or __testing_os_permission_matrix if OS defaults changed.
    success_msg: "{{ item['path'] }} matches OS default ({{ item['mode'] }})"
  loop: >-
    {{
      __testing_permissions
      | ansible.builtin.selectattr('expected_mode_os', 'ansible.builtin.defined')
      | ansible.builtin.rejectattr('expected_mode_os', 'ansible.builtin.none')
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item['path'] }}"


## Access-preservation preflight (negative test)
#
# Re-run the role with an AllowUsers value that excludes the Ansible connection
# account. The role writes the restrictive configuration, but the access
# preflight must abort before the queued restart handler normally runs. The
# running daemon therefore retains its previous configuration under normal
# Ansible handler semantics. The rescue restores valid on-disk configuration
# before the play completes.
#
# This is a best-effort safeguard: force_handlers or --force-handlers can still
# execute a queued restart after a task failure.

- name: "Molecule | Verify | Access preflight negative test"
  block:

    - name: "Molecule | Verify | Write a restrictive config and expect the access preflight to abort"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"
      vars:
        run_sshd_service_settings:
          AllowUsers: "user-that-cannot-log-in"

    - name: "Molecule | Verify | Fail the test because the preflight did NOT abort the run"
      ansible.builtin.fail:
        msg: >-
          The access preflight did not abort even though AllowUsers excludes the
          Ansible connection account.

  rescue:

    - name: "Molecule | Verify | Assert the run aborted at the access preflight"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Access preflight')
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('lock the connection account out')
        fail_msg: >-
          The role failed, but not at the access preflight assert as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: >-
          The access preflight aborted after detecting that AllowUsers excludes the
          Ansible connection account.

    - name: "Molecule | Verify | Access preflight | Refresh service facts after rejection"
      ansible.builtin.service_facts:

    - name: "Molecule | Verify | Access preflight | Assert sshd remains running after rejection"
      ansible.builtin.assert:
        that:
          - __run_sshd_sshd_servicename in ansible_facts['services']
          - ansible_facts['services'][__run_sshd_sshd_servicename]['state'] == 'running'
        fail_msg: >-
          The sshd service is not running after the access preflight rejected the
          restrictive configuration.
        success_msg: >-
          The sshd service remains running after the access preflight rejected the
          restrictive configuration.

    - name: "Molecule | Verify | Restore a valid configuration after the negative test"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"


## Access-preservation preflight (unsatisfiable AuthenticationMethods)
#
# An AuthenticationMethods value listing only alternatives whose methods are
# disabled makes every login impossible. "sshd -t" already rejects globally
# unsatisfiable values at validation time (the drop-in write fails, nothing
# is applied), but it cannot evaluate Match-scoped ones: only the preflight's
# effective-policy evaluation ("sshd -T -C") resolves the Match block and can
# prove this lockout. Same best-effort contract as above.

- name: "Molecule | Verify | Access preflight AuthenticationMethods negative test"
  block:

    - name: "Molecule | Verify | Write an unsatisfiable AuthenticationMethods config and expect the access preflight to abort"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"
      vars:
        # Dict order is deliberate: new keys render after the (merged) default
        # settings, so "Match User root" starts a block and the
        # AuthenticationMethods line below it is Match-scoped. The
        # PasswordAuthentication override stays global (it replaces a default
        # setting and keeps its position before the Match line).
        run_sshd_service_settings:
          PasswordAuthentication: "no"
          Match: "User root"
          AuthenticationMethods: "publickey,password"

    - name: "Molecule | Verify | Fail the test because the preflight did NOT abort the run (AuthenticationMethods)"
      ansible.builtin.fail:
        msg: >-
          The access preflight did not abort even though no AuthenticationMethods
          alternative is satisfiable (publickey,password with PasswordAuthentication no).

  rescue:

    - name: "Molecule | Verify | Assert the run aborted at the access preflight because of AuthenticationMethods"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Access preflight')
          - (ansible_failed_result['msg'] | ansible.builtin.default('')) is ansible.builtin.search('AuthenticationMethods')
        fail_msg: >-
          The role failed, but not at the access preflight with an AuthenticationMethods
          reason as expected (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}', message:
          '{{ ansible_failed_result['msg'] | ansible.builtin.default('') | ansible.builtin.truncate(200) }}').
        success_msg: >-
          The access preflight aborted after detecting that no AuthenticationMethods
          alternative is satisfiable.

    - name: "Molecule | Verify | Restore a valid configuration after the AuthenticationMethods test"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"


## Access-preservation preflight (user@host patterns against the SSH context)
#
# The preflight takes the client address from the session's SSH_CONNECTION
# variable. Molecule connects via "podman exec" (no such variable), so a
# synthetic one is injected: the preflight must approve an AllowUsers host part
# matching the injected client address and abort on one that excludes it.

- name: "Molecule | Verify | Access preflight approves a matching user@host AllowUsers pattern"
  ansible.builtin.include_role:
    name: "foundata.sshd.run"
    apply:
      environment:
        SSH_CONNECTION: "192.0.2.10 51515 192.0.2.1 22"
  vars:
    run_sshd_service_settings:
      AllowUsers: "root@192.0.2.*" # Molecule's Podman connection account is root


- name: "Molecule | Verify | Access preflight user@host negative test"
  block:

    - name: "Molecule | Verify | Write an AllowUsers pattern excluding the client address and expect the access preflight to abort"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"
        apply:
          environment:
            SSH_CONNECTION: "192.0.2.10 51515 192.0.2.1 22"
      vars:
        run_sshd_service_settings:
          AllowUsers: "root@203.0.113.99"

    - name: "Molecule | Verify | Fail the test because the preflight did NOT abort the run (user@host)"
      ansible.builtin.fail:
        msg: >-
          The access preflight did not abort even though the AllowUsers host part
          excludes the (injected) client address.

  rescue:

    - name: "Molecule | Verify | Assert the run aborted at the access preflight because of the user@host pattern"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Access preflight')
          - (ansible_failed_result['msg'] | ansible.builtin.default('')) is ansible.builtin.search('AllowUsers')
        fail_msg: >-
          The role failed, but not at the access preflight with an AllowUsers reason
          as expected (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: >-
          The access preflight aborted after detecting that the AllowUsers host part
          excludes the client address.

    - name: "Molecule | Verify | Restore a valid configuration after the user@host test"
      ansible.builtin.include_role:
        name: "foundata.sshd.run"


## Uninstall (state "absent") verification
#
# This block stays the LAST one in the verify stage: it converges the
# instances away from the state every earlier check relies on. It is
# deliberately not part of the cleanup stage - cleanup also runs when an
# earlier stage fails (on arbitrary state) and has to stay assertion-free.
# Removing openssh-server inside the instances is safe: Molecule's Podman
# driver connects via "podman exec", not SSH.

# Earlier verify steps (e.g. the restored configuration after the negative
# access-preflight test) notified restart handlers. Run them now against the
# still-installed service - deferred to the end of the play they would fire
# after the uninstall has removed the unit.
- name: "Molecule | Verify | Uninstall: run the pending notified handlers first"
  ansible.builtin.meta: "flush_handlers"


- name: "Molecule | Verify | Uninstall: record the host key state before the uninstall"
  ansible.builtin.stat:
    path: "/etc/ssh/ssh_host_ed25519_key"
  register: __testing_uninstall_hostkey_before


- name: "Molecule | Verify | Uninstall: run the role with state 'absent'"
  ansible.builtin.include_role:
    name: "foundata.sshd.run"
  vars:
    run_sshd_state: "absent"
    run_sshd_config_service_dropin_file_name: "00-custom-dropin.conf"


- name: "Molecule | Verify | Uninstall: check the role-managed files and the server are gone"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_uninstall_gone_stat
  failed_when:
    - __testing_uninstall_gone_stat['stat']['exists']
  loop:
    - "/etc/ssh/sshd_config.d/00-custom-dropin.conf"
    - "/etc/ssh/sshd_config.d/00-managed.conf"
    - "/usr/sbin/sshd"


# Host keys are not owned by the packages (they are generated on the host)
# and identify the machine: a package uninstall must never delete them.
- name: "Molecule | Verify | Uninstall: check the host key survived the uninstall"
  ansible.builtin.stat:
    path: "/etc/ssh/ssh_host_ed25519_key"
  register: __testing_uninstall_hostkey_after
  failed_when:
    - __testing_uninstall_hostkey_after['stat']['exists']
      != __testing_uninstall_hostkey_before['stat']['exists']
