---

breaking_changes:
  - >
    ``run`` role - The default ``KexAlgorithms`` changed from
    ``curve25519-sha256@libssh.org`` to the hybrid post-quantum
    ``sntrup761x25519-sha512@openssh.com``. Classical X25519/ECDH key exchange
    offers no protection against "harvest now, decrypt later" attacks: an
    adversary can record a handshake today and recover the session key once a
    quantum computer can run Shor's algorithm against the X25519 ECDH.
    ``sntrup761x25519-sha512@openssh.com`` combines the NTRU Prime KEM *with*
    X25519, so the session key stays secure unless both are broken. Note that
    this is not about the ``@libssh.org`` vendor alias: the standardized name
    ``curve25519-sha256`` denotes the same algorithm and is equally affected.
  - >
    ``run`` role - Because the SSH daemon now only offers a post-quantum key
    exchange, **clients older than OpenSSH 8.5 can no longer connect** (for
    example Debian 11, Ubuntu 20.04, RHEL 8 or macOS up to and including 12).
    Verify your clients before upgrading. To keep a classical key exchange
    available as a fallback, override the default, keeping in mind that this
    re-introduces the "harvest now, decrypt later" exposure:

    .. code-block:: yaml

        run_sshd_service_settings:
          KexAlgorithms: "sntrup761x25519-sha512@openssh.com,curve25519-sha256"

minor_changes:
  - >
    ``run`` role - The default configuration passes
    `ssh-audit <https://github.com/jtesta/ssh-audit>`__ without warnings again.
    ssh-audit 3.9.0 flags every classical-only key exchange with "does not
    provide protection against post-quantum attacks", which the previous default
    triggered. ``sntrup761x25519-sha512@openssh.com`` was chosen over
    ``mlkem768x25519-sha256`` (NIST FIPS 203) because it is available on every
    platform supported by this role (OpenSSH 8.5 and later), whereas
    ``mlkem768x25519-sha256`` requires OpenSSH 9.9 and is therefore missing on
    Debian 12, Ubuntu 22.04 and Ubuntu 24.04.
