  - "*.tar.gz"
  - ".ansible"
  # Parts of the collection itself
  - "changelogs/.plugin-cache.yaml"
  - "changelogs/fragments/00-fragment-template.txt"
  - "changelogs/fragments/archive"
  - "extensions/molecule"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  - "DEVELOPMENT.md"
  # Development tooling
  - ".gitattributes"
  - ".gitignore"
  - ".releasing.toml"
  - ".rumdl.toml"
  - "hack"
  - "releasing.toml"
  - "rumdl.toml"
  # Repository hosting
  - ".github"
  - ".gitlab"
  # Editor / IDE configuration
  - ".idea"
  - ".vscode"
  # Coding agents
  - ".aider.conf.yml"
  - ".aiderignore"
  - ".claude"
  - ".continue"
  - ".cursor"
  - ".cursorrules"
  - ".windsurf"
  - ".windsurfrules"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "GEMINI.md"
  # OS metadata
  - ".DS_Store"
  - "Desktop.ini"
  - "Thumbs.db"
