# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Extract configured host keys"
  ansible.builtin.set_fact:
    __run_sshd_configured_hostkeys: >-
      {{
        (__run_sshd_effective_sshd_settings.HostKey is ansible.builtin.string)
        | ansible.builtin.ternary([__run_sshd_effective_sshd_settings.HostKey], __run_sshd_effective_sshd_settings.HostKey)
        | ansible.builtin.default([])
      }}


- name: "Config | Default | Check if all configured host keys exist"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ __run_sshd_configured_hostkeys }}"
  register: __run_sshd_hostkey_stats


- name: "Config | Default | Generate missing sshd host keys"
  # ssh-keygen -A automatically checks for existing RSA, ECDSA, and ED25519 host
  # keys and generates only the missing ones (regardless of configuration). The
  # command produces output only when it creates new key files, making it easy
  # to detect actual changes.
  # /usr/libexec/openssh/sshd-keygen would be a more flexible alternative as it
  # accepts specific key types as arguments, but it is usually only available on
  # Red Hat-based distributions.
  ansible.builtin.command:
    argv:
      - "{{ __run_sshd_sshkeygen_exec_path }}"
      - "-A"
  when:
    - __run_sshd_hostkey_stats['results']
      | ansible.builtin.map(attribute='stat.exists')
      | ansible.builtin.select('equalto', false)
      | ansible.builtin.list
      | ansible.builtin.length > 0
  changed_when:
    - __run_sshd_sshkeygen_result['rc'] == 0
    - __run_sshd_sshkeygen_result['stdout'] | ansible.builtin.trim | ansible.builtin.length > 0
  register: __run_sshd_sshkeygen_result
  notify: "run_sshd: restart sshd.service"


- name: "Config | Default | Print effective config (merged defaults with passedvalues)"
  ansible.builtin.debug:
    var: __run_sshd_effective_sshd_settings
    verbosity: 4


- name: "Config | Default | Ensure drop-in service config directory exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __run_sshd_config_service_dropin_dir_path }}"
    state: "directory"
    owner: "{{ __run_sshd_config_service_dropin_dir_owner }}"
    group: "{{ __run_sshd_config_service_dropin_dir_group }}"
    mode: "{{ __run_sshd_config_service_dropin_dir_mode }}"
  notify: "run_sshd: restart sshd.service"


- name: "Config | Default | Create drop-in service config file"
  ansible.builtin.template:
    src: "drop-in.conf.j2"
    dest: "{{ __run_sshd_config_service_dropin_file_path }}"
    owner: "{{ __run_sshd_config_service_dropin_file_owner }}"
    group: "{{ __run_sshd_config_service_dropin_file_group }}"
    mode: "{{ __run_sshd_config_service_dropin_file_mode }}"
    # Validate the rendered drop-in with 'sshd -t' before it is put in place, so
    # an invalid run_sshd_service_settings value cannot reach the restart handler
    # and leave sshd unable to start.
    validate: "{{ __run_sshd_sshd_exec_path }} -t -f %s"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_settings: "{{ __run_sshd_effective_sshd_settings }}"
  notify: "run_sshd: restart sshd.service"


- name: "Config | Default | Remove role's default service drop-in config file (if custom filename is used)"
  ansible.builtin.file:
    path: "{{ __run_sshd_config_service_dropin_file_path_default }}"
    state: "absent"
  when:
    - __run_sshd_config_service_dropin_file_path != __run_sshd_config_service_dropin_file_path_default
  notify:
    - "run_sshd: restart sshd.service"


# "00-ansible.conf" was used up until v1.3.0 of this collection's run role and was not configurable. The default
# filename was renamed, and the old file must be cleaned up (especially since its filename would take precedence).
- name: "Config | Default | Remove old drop-in service config file from previous role versions (if not set as custom filename)"
  ansible.builtin.file:
    path: "{{ __run_sshd_config_service_dropin_dir_path }}/00-ansible.conf"
    state: "absent"
  when:
    - __run_sshd_config_service_dropin_file_path != (__run_sshd_config_service_dropin_dir_path ~ '/00-ansible.conf')
  notify:
    - "run_sshd: restart sshd.service"


- name: "Config | Default | Search for drop-in service config files"
  ansible.builtin.find:
    paths: "{{ __run_sshd_config_service_dropin_dir_path }}"
    patterns: '^.+\.conf$'
    use_regex: true
    hidden: true
    recurse: false
    follow: true
  register: __run_sshd_find_sshd_configd_result


- name: "Config | Default | Show search results of drop-in service config files"
  ansible.builtin.debug:
    msg: "{{ __run_sshd_find_sshd_configd_result['files'] }}"
    verbosity: 4
  when:
    - __run_sshd_find_sshd_configd_result is ansible.builtin.defined
    - __run_sshd_find_sshd_configd_result['files'] is ansible.builtin.defined
    - __run_sshd_find_sshd_configd_result['files'] | ansible.builtin.length > 0


- name: "Config | Default | Get contents of drop-in service config files"
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: __run_sshd_slurp_sshd_configd_result
  loop: "{{ __run_sshd_find_sshd_configd_result['files'] | ansible.builtin.map(attribute='path') }}"
  when:
    - __run_sshd_find_sshd_configd_result is ansible.builtin.defined
    - __run_sshd_find_sshd_configd_result['files'] is ansible.builtin.defined
    - __run_sshd_find_sshd_configd_result['files'] | ansible.builtin.length > 0


- name: "Config | Default | Show contents of drop-in service config files"
  ansible.builtin.debug:
    msg: "{{ __run_sshd_slurp_sshd_configd_result['results'] }}"
    verbosity: 4
  when:
    - __run_sshd_slurp_sshd_configd_result is ansible.builtin.defined
    - __run_sshd_slurp_sshd_configd_result['results'] is ansible.builtin.defined
    - __run_sshd_slurp_sshd_configd_result['results'] | ansible.builtin.length > 0


- name: "Config | Default | Create a list of options configured in drop-in service config files"
  ansible.builtin.set_fact:
    __run_sshd_dropin_options: |-
      {%- set options = [] -%}
      {%- for file_content in (__run_sshd_slurp_sshd_configd_result['results']
                               | ansible.builtin.map(attribute='content')
                               | ansible.builtin.map('ansible.builtin.b64decode')
                               | ansible.builtin.list) -%}
        {%- for line in file_content.splitlines() -%}
          {%- if line | ansible.builtin.regex_search('^[^#].+$', multiline=false, ignorecase=true) -%}
            {%- set ssh_option_name = line | ansible.builtin.regex_replace('\s+', ' ') | ansible.builtin.trim -%}
            {%- if ssh_option_name | ansible.builtin.regex_search('^Subsystem[\t ]+', multiline=false, ignorecase=true) -%}
              {%- set ssh_option_name = (ssh_option_name | ansible.builtin.split(' '))[0:2] | ansible.builtin.join('[\\t ]+') -%}
            {%- else -%}
              {%- set ssh_option_name = (ssh_option_name | ansible.builtin.split(' '))[0] -%}
            {%- endif -%}
            {%- if ssh_option_name and ssh_option_name not in options -%}
              {%- set _ = options.append(ssh_option_name) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ options }}
  when:
    - __run_sshd_slurp_sshd_configd_result is ansible.builtin.defined
    - __run_sshd_slurp_sshd_configd_result['results'] is ansible.builtin.defined
    - __run_sshd_slurp_sshd_configd_result['results'] | ansible.builtin.length > 0


- name: "Config | Default | Show the list of options configured in drop-in service config files"
  ansible.builtin.debug:
    var: __run_sshd_dropin_options
    verbosity: 4
  when:
    - __run_sshd_dropin_options is ansible.builtin.defined
    - __run_sshd_dropin_options | ansible.builtin.length > 0


- name: "Config | Default | Ensure main service config file exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __run_sshd_config_service_file_path }}"
    state: "touch"
    owner: "{{ __run_sshd_config_service_file_owner }}"
    group: "{{ __run_sshd_config_service_file_group }}"
    mode: "{{ __run_sshd_config_service_file_mode }}"
    access_time: "preserve"
    modification_time: "preserve"


- name: "Config | Default | Ensure 'Include' directive exists in main service config file"
  ansible.builtin.lineinfile:
    path: "{{ __run_sshd_config_service_file_path }}"
    line: "Include {{ __run_sshd_config_service_dropin_dir_path }}/*.conf"
    state: "present"
    validate: "{{ __run_sshd_sshd_exec_path }} -t -f %s"
  notify: "run_sshd: restart sshd.service"


# Remember: It is not possible to overwrite values in the sshd config, first occurrence wins.
- name: "Config | Default | Comment out duplicates in main service config file (if any) to ensure drop-in service config precedence"
  ansible.builtin.replace:
    path: "{{ __run_sshd_config_service_file_path }}"
    # Notes on the regex:
    # - {{ __run_sshd_dropin_options | ansible.builtin.join('|') }} will result in something like
    #   HostKey|LogLevel|LoginGraceTime| [...] |Subsystem[\\t ]+sftp|KexAlgorithms\
    # - Include has to be excluded from commenting as it can exists multiple times.
    # - When options are joined with '|', an empty (whitespace-only) option would
    #   produce patterns like 'foo||bar', where '||' matches an empty string at any
    #   position. The 'select' filter prevents this.
    #   Even though we already ensure that empty options do not enter
    #   __run_sshd_dropin_options, this provides an extra layer of safety.
    # - (?=[\t ]|$) is a safeguard to prevent partial option matches (e.g., 'Foo'
    #   accidentally matching 'FooBar' if such a token appeared).
    regexp: >-
      ^(?![\t ]*#)([\t ]*)(?!Include)({{ __run_sshd_dropin_options | ansible.builtin.select | ansible.builtin.join('|') }})(?=[\t ]|$)(.*)
    replace: '#\1\2\3'
    validate: "{{ __run_sshd_sshd_exec_path }} -t -f %s"
  notify: "run_sshd: restart sshd.service"


# Access-preservation preflight (anti-lockout): A restrictive
# AllowUsers/AllowGroups/DenyUsers/DenyGroups, a 'PermitRootLogin' value the
# connection cannot satisfy (when connecting as root), an unsatisfiable
# AuthenticationMethods combination, a Match block, or disabling every
# authentication method all pass syntax validation, reach the restart handler,
# and can lock the connection out on the next login.
#
# Contract (best effort): the drop-in is already written to disk at this point
# and is NOT rolled back on failure. Aborting prevents the queued restart
# handler under normal Ansible failure semantics, so the running daemon keeps
# its previous configuration; a later manual restart or reboot would apply the
# restrictive file. force_handlers (or --force-handlers) still runs queued
# handlers after the failure and defeats this restart prevention. Only common
# lockout scenarios are detected and only provable lockouts fail the run, see
# the run_sshd_config_access_check documentation.
#
# 'sshd -T -C user=...' (extended test mode) resolves Match blocks and prints the
# effective directives for a hypothetical connection. When Ansible is connected
# over SSH, the connection context (client address, server address and port) is
# taken from the session's SSH_CONNECTION variable so source-dependent Match
# blocks and 'user@host' patterns are evaluated against the real client;
# otherwise localhost/127.0.0.1 is assumed.
#
# The connection account, its groups and the connection context are read with
# 'become: false' so they reflect the account/session that actually logs in via
# SSH (not a possible privilege escalation target, whose environment also lacks
# SSH_CONNECTION), while 'sshd -T' inherits the play's privileges as it needs
# to read host keys. In check mode the drop-in is not written, so the preflight
# would evaluate the old config and is skipped.
- name: "Config | Default | Access preflight"
  when:
    - run_sshd_config_access_check | ansible.builtin.bool
    - not ansible_check_mode
  block:

    - name: "Config | Default | Access preflight | Determine the Ansible connection account (unprivileged)"
      ansible.builtin.command:
        argv:
          - "id"
          - "-un"
      become: false
      changed_when:
        - false
      check_mode: false
      register: __run_sshd_preflight_conn_user_raw


    - name: "Config | Default | Access preflight | Determine the groups of the Ansible connection account (unprivileged)"
      ansible.builtin.command:
        argv:
          - "id"
          - "-Gn"
      become: false
      changed_when:
        - false
      check_mode: false
      register: __run_sshd_preflight_conn_groups_raw


    - name: "Config | Default | Access preflight | Determine the SSH connection context (unprivileged)"
      # SSH_CONNECTION is "<client ip> <client port> <server ip> <server port>"
      # in SSH sessions and absent for other connection plugins (containers,
      # local). ansible.builtin.shell is used intentionally: expanding an
      # environment variable of the login session needs a shell.
      ansible.builtin.shell:
        cmd: |
          printf '%s' "${SSH_CONNECTION-}"
      become: false
      changed_when:
        - false
      check_mode: false
      register: __run_sshd_preflight_conn_ctx_raw


    - name: "Config | Default | Access preflight | Build the connection context for the policy evaluation"
      ansible.builtin.set_fact:
        # Client address the 'user@host' access-list patterns are matched
        # against; empty when the connection context is unknown.
        __run_sshd_preflight_client_addr: >-
          {{ __run_sshd_preflight_ctx[0] if (__run_sshd_preflight_ctx_valid | ansible.builtin.bool) else '' }}
        __run_sshd_preflight_conn_spec: >-
          {{
            ('user=' ~ __run_sshd_preflight_user
             ~ ',host=' ~ __run_sshd_preflight_ctx[0] ~ ',addr=' ~ __run_sshd_preflight_ctx[0]
             ~ ',laddr=' ~ __run_sshd_preflight_ctx[2] ~ ',lport=' ~ __run_sshd_preflight_ctx[3])
            if (__run_sshd_preflight_ctx_valid | ansible.builtin.bool)
            else ('user=' ~ __run_sshd_preflight_user ~ ',host=localhost,addr=127.0.0.1')
          }}
      vars:
        __run_sshd_preflight_user: "{{ __run_sshd_preflight_conn_user_raw['stdout'] | ansible.builtin.trim }}"
        __run_sshd_preflight_ctx: "{{ (__run_sshd_preflight_conn_ctx_raw['stdout'] | ansible.builtin.trim).split() }}"
        __run_sshd_preflight_ctx_valid: "{{ (__run_sshd_preflight_ctx | ansible.builtin.length) == 4 }}"


    - name: "Config | Default | Access preflight | Evaluate the effective sshd policy for the connection account"
      ansible.builtin.command:
        argv:
          - "{{ __run_sshd_sshd_exec_path }}"
          - "-T"
          - "-f"
          - "{{ __run_sshd_config_service_file_path }}"
          - "-C"
          - "{{ __run_sshd_preflight_conn_spec }}"
      changed_when:
        - false
      check_mode: false
      failed_when:
        - false
      register: __run_sshd_preflight_sshdt


    # Build a list of human-readable lockout reasons (empty = access preserved).
    # sshd -T lowercases directive names and prints AllowUsers/AllowGroups/...
    # only when set (one value per line is possible), so tokens are gathered
    # across all matching lines. Access-list matching mirrors sshd's order
    # (DenyUsers, AllowUsers, DenyGroups, AllowGroups) and its glob semantics:
    # a leading '!' negates, '*'/'?' are wildcards, and the host part of
    # 'user@host' patterns is matched against the real client address (when
    # known from SSH_CONNECTION). Patterns whose host part cannot be evaluated
    # (unknown context, DNS name based patterns) count as satisfied: only
    # provable lockouts fail the run.
    - name: "Config | Default | Access preflight | Determine whether the effective policy would lock the connection account out"
      ansible.builtin.set_fact:
        __run_sshd_preflight_lockout_reasons: |-
          {#- glob2re(p): one sshd glob pattern ('*'/'?') as anchored-ready regex. -#}
          {#- Note: backslash escape sequences are NOT collapsed in this Jinja -#}
          {#- context, so '\*' below is exactly backslash + star (the sequence -#}
          {#- regex_escape produces). -#}
          {%- macro glob2re(p) -%}
          {{- p | ansible.builtin.regex_escape
               | ansible.builtin.replace('\*', '.*')
               | ansible.builtin.replace('\?', '.') -}}
          {%- endmacro -%}
          {#- pat3(name, pat, addr): 'hit', 'maybe' or 'no' for one pattern (no '!'). -#}
          {#- 'user@host' patterns hit when the user part matches AND the host part -#}
          {#- matches the client address; an address-like host part that does not -#}
          {#- match is 'no', an unevaluable one (no known address or a DNS name -#}
          {#- pattern) is 'maybe'. -#}
          {%- macro pat3(name, pat, addr) -%}
          {%-   set up = pat.split('@', 1)[0] if '@' in pat else pat -%}
          {%-   set hp = pat.split('@', 1)[1] if '@' in pat else '' -%}
          {%-   if not (name is ansible.builtin.regex('^(' ~ glob2re(up) ~ ')$')) -%}
          {{-     'no' -}}
          {%-   elif hp == '' -%}
          {{-     'hit' -}}
          {%-   elif ((addr | ansible.builtin.length) > 0)
                    and (addr is ansible.builtin.regex('^(' ~ glob2re(hp) ~ ')$')) -%}
          {{-     'hit' -}}
          {%-   elif ((addr | ansible.builtin.length) > 0)
                    and (hp is ansible.builtin.regex('^[0-9A-Fa-f:.*?]+$')) -%}
          {{-     'no' -}}
          {%-   else -%}
          {{-     'maybe' -}}
          {%-   endif -%}
          {%- endmacro -%}
          {#- list3(name, plist, addr): "<pos>/<neg>" with 'hit'/'maybe'/'no' each, -#}
          {#- aggregated over the positive and the '!'-negated patterns of a list. -#}
          {%- macro list3(name, plist, addr) -%}
          {%-   set st = namespace(pos='no', neg='no') -%}
          {%-   for pat in plist -%}
          {%-     set isneg = pat.startswith('!') -%}
          {%-     set s = pat3(name, (pat[1:] if isneg else pat), addr) | ansible.builtin.trim -%}
          {%-     if isneg -%}
          {%-       if s == 'hit' -%}{%- set st.neg = 'hit' -%}
          {%-       elif s == 'maybe' and st.neg == 'no' -%}{%- set st.neg = 'maybe' -%}
          {%-       endif -%}
          {%-     else -%}
          {%-       if s == 'hit' -%}{%- set st.pos = 'hit' -%}
          {%-       elif s == 'maybe' and st.pos == 'no' -%}{%- set st.pos = 'maybe' -%}
          {%-       endif -%}
          {%-     endif -%}
          {%-   endfor -%}
          {{- st.pos ~ '/' ~ st.neg -}}
          {%- endmacro -%}
          {%- set user = __run_sshd_preflight_conn_user_raw['stdout'] | ansible.builtin.trim -%}
          {%- set groups = (__run_sshd_preflight_conn_groups_raw['stdout'] | ansible.builtin.trim).split() -%}
          {%- set addr = __run_sshd_preflight_client_addr | ansible.builtin.default('', true) -%}
          {%- set ns = namespace(reasons=[], au=[], du=[], ag=[], dg=[], am=[],
                                 proot='', pk='', pw='', kbd='', gss='', hb='',
                                 ghit=false, amok=false) -%}
          {%- if __run_sshd_preflight_sshdt['rc'] != 0 -%}
          {%-   set _ = ns.reasons.append(
                  'the effective configuration could not be evaluated with "sshd -T" (rc='
                  ~ __run_sshd_preflight_sshdt['rc'] ~ '): '
                  ~ (__run_sshd_preflight_sshdt['stderr'] | ansible.builtin.trim | ansible.builtin.truncate(200))) -%}
          {%- else -%}
          {%-   for line in __run_sshd_preflight_sshdt['stdout_lines'] -%}
          {%-     set p = line.split() -%}
          {%-     if (p | ansible.builtin.length) >= 2 -%}
          {%-       set k = p[0] | ansible.builtin.lower -%}
          {%-       if k == 'allowusers' -%}{%- set ns.au = ns.au + p[1:] -%}
          {%-       elif k == 'denyusers' -%}{%- set ns.du = ns.du + p[1:] -%}
          {%-       elif k == 'allowgroups' -%}{%- set ns.ag = ns.ag + p[1:] -%}
          {%-       elif k == 'denygroups' -%}{%- set ns.dg = ns.dg + p[1:] -%}
          {%-       elif k == 'authenticationmethods' -%}{%- set ns.am = ns.am + p[1:] -%}
          {%-       elif k == 'permitrootlogin' -%}{%- set ns.proot = p[1] | ansible.builtin.lower -%}
          {%-       elif k == 'pubkeyauthentication' -%}{%- set ns.pk = p[1] | ansible.builtin.lower -%}
          {%-       elif k == 'passwordauthentication' -%}{%- set ns.pw = p[1] | ansible.builtin.lower -%}
          {%-       elif k == 'kbdinteractiveauthentication' -%}{%- set ns.kbd = p[1] | ansible.builtin.lower -%}
          {%-       elif k == 'gssapiauthentication' -%}{%- set ns.gss = p[1] | ansible.builtin.lower -%}
          {%-       elif k == 'hostbasedauthentication' -%}{%- set ns.hb = p[1] | ansible.builtin.lower -%}
          {%-       endif -%}
          {%-     endif -%}
          {%-   endfor -%}
          {#- Access lists, in sshd's evaluation order. A deny only counts when -#}
          {#- provable (definite positive hit, no definite or possible negation); -#}
          {#- an allow list is satisfied by a definite or possible hit. -#}
          {%-   set du = (list3(user, ns.du, addr) | ansible.builtin.trim).split('/') -%}
          {%-   if du[0] == 'hit' and du[1] == 'no' -%}
          {%-     set _ = ns.reasons.append('DenyUsers matches the connection account "' ~ user ~ '"') -%}
          {%-   endif -%}
          {%-   set au = (list3(user, ns.au, addr) | ansible.builtin.trim).split('/') -%}
          {%-   if (ns.au | ansible.builtin.length) > 0 and (au[0] == 'no' or au[1] == 'hit') -%}
          {%-     set _ = ns.reasons.append('AllowUsers does not include the connection account "' ~ user ~ '"') -%}
          {%-   endif -%}
          {%-   set ns.ghit = false -%}
          {%-   for g in groups -%}
          {%-     set dg = (list3(g, ns.dg, addr) | ansible.builtin.trim).split('/') -%}
          {%-     if dg[0] == 'hit' and dg[1] == 'no' -%}{%- set ns.ghit = true -%}{%- endif -%}
          {%-   endfor -%}
          {%-   if ns.ghit -%}
          {%-     set _ = ns.reasons.append('DenyGroups matches a group of the connection account "' ~ user ~ '"') -%}
          {%-   endif -%}
          {%-   set ns.ghit = false -%}
          {%-   for g in groups -%}
          {%-     set ag = (list3(g, ns.ag, addr) | ansible.builtin.trim).split('/') -%}
          {%-     if ag[0] != 'no' and ag[1] != 'hit' -%}{%- set ns.ghit = true -%}{%- endif -%}
          {%-   endfor -%}
          {%-   if (ns.ag | ansible.builtin.length) > 0 and not ns.ghit -%}
          {%-     set _ = ns.reasons.append('AllowGroups does not include any group of the connection account "' ~ user ~ '"') -%}
          {%-   endif -%}
          {#- PermitRootLogin and authentication-method survival. -#}
          {%-   if user == 'root' and ns.proot == 'no' -%}
          {%-     set _ = ns.reasons.append('PermitRootLogin is "no" and the connection account is root') -%}
          {%-   endif -%}
          {%-   if user == 'root' and ns.proot in ['prohibit-password', 'without-password'] and ns.pk == 'no' -%}
          {%-     set _ = ns.reasons.append('PermitRootLogin "' ~ ns.proot
                    ~ '" only permits public-key based root logins but PubkeyAuthentication is "no"') -%}
          {%-   endif -%}
          {%-   if user == 'root' and ns.proot == 'forced-commands-only' -%}
          {%-     set _ = ns.reasons.append('PermitRootLogin is "forced-commands-only" and the connection account is root '
                    ~ '(only keys with a forced command may log in, Ansible needs arbitrary commands)') -%}
          {%-   endif -%}
          {%-   if ns.pk == 'no' and ns.pw == 'no' and ns.kbd == 'no' and ns.gss == 'no' and ns.hb == 'no' -%}
          {%-     set _ = ns.reasons.append('all authentication methods (pubkey, password, keyboard-interactive, GSSAPI, hostbased) are disabled') -%}
          {%-   endif -%}
          {#- AuthenticationMethods: every listed alternative (comma-joined methods -#}
          {#- that must all succeed) has to survive the per-method toggles; unknown -#}
          {#- method tokens count as available (only provable lockouts fail). -#}
          {%-   set toggles = {'publickey': ns.pk, 'password': ns.pw, 'keyboard-interactive': ns.kbd,
                               'gssapi-with-mic': ns.gss, 'gssapi-keyex': ns.gss, 'hostbased': ns.hb} -%}
          {%-   if (ns.am | ansible.builtin.length) > 0 and ns.am != ['any'] -%}
          {%-     set ns.amok = false -%}
          {%-     for alt in ns.am -%}
          {%-       set altns = namespace(sat=true) -%}
          {%-       for m in alt.split(',') -%}
          {%-         set mbase = (m.split(':') | ansible.builtin.first) | ansible.builtin.lower -%}
          {%-         if (mbase in toggles) and (toggles[mbase] == 'no') -%}{%- set altns.sat = false -%}{%- endif -%}
          {%-       endfor -%}
          {%-       if altns.sat -%}{%- set ns.amok = true -%}{%- endif -%}
          {%-     endfor -%}
          {%-     if not ns.amok -%}
          {%-       set _ = ns.reasons.append('no AuthenticationMethods alternative ('
                      ~ (ns.am | ansible.builtin.join(' ')) ~ ') is satisfiable with the enabled authentication methods') -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endif -%}
          {{ ns.reasons }}


    - name: "Config | Default | Access preflight | Fail if the effective configuration would lock the connection account out"
      ansible.builtin.assert:
        that:
          - (__run_sshd_preflight_lockout_reasons | ansible.builtin.length) == 0
        fail_msg: >-
          Refusing to apply the sshd configuration: the effective policy would lock the
          Ansible connection account '{{ __run_sshd_preflight_conn_user_raw['stdout'] | ansible.builtin.trim }}'
          out of SSH ({{ __run_sshd_preflight_lockout_reasons | ansible.builtin.join('; ') }}). Fix
          'run_sshd_service_settings', or set 'run_sshd_config_access_check: false' to bypass
          this safeguard (only if you are certain you retain another way to access the host).
        success_msg: >-
          Access preflight: the Ansible connection account
          '{{ __run_sshd_preflight_conn_user_raw['stdout'] | ansible.builtin.trim }}' retains SSH
          access under the effective configuration.
