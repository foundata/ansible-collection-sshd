# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Determines whether the managed resources should be `present` or `absent`.
#
# `present` ensures that required components, such as software packages, are
# installed and configured.
#
# `absent` reverts changes as much as possible, such as removing packages,
# deleting created users, stopping services, restoring modified settings, ...
#
# - Type: str
# - Required: No
# - Default: present
# - Choices: present, absent
run_sshd_state: "present"

# If set to `true`, all managed packages will be upgraded during each Ansible
# run (e.g., when the package provider detects a newer version than the
# currently installed one).
#
# - Type: bool
# - Required: No
# - Default: false
run_sshd_autoupgrade: false

# Defines the status of the service(s).
#
# `enabled`: Service is running and will start automatically at boot.
#
# `disabled`: Service is stopped and will not start automatically at boot.
#
# `running` Service is running but will not start automatically at boot. This
# can be used to start a service on the first Ansible run without enabling it
# for boot.
#
# `unmanaged`: Ansible does not manage the service at all: both the running
# state and the boot (enablement) state are left exactly as they are. This is
# primarily useful when services are monitored and managed by systems other than
# Ansible.
#
# The singular form (`service`) is used for simplicity. However, the defined
# status applies to all services if multiple are being managed by this role.
#
# - Type: str
# - Required: No
# - Default: enabled
# - Choices: enabled, disabled, running, unmanaged
run_sshd_service_state: "enabled"

# sshd service configuration values (additional ones or to overwrite defaults;
# see `__run_sshd_service_settings_defaults` in `vars/main.yml` for them).
#
# Simply use standard SSH option names as keys with their corresponding values.
# Special cases:
#
# - For boolean values, use `true`/`false` (these will be converted to
#   "yes"/"no" strings by the role as needed).
# - For options that can have multiple values, you can use a list:
#   ```
#   HostKey:
#     - "/etc/ssh/ssh_host_ed25519_key"
#     - "/etc/ssh/ssh_host_ecdsa_key"
#   ```
#   This will generate multiple entries in the config file, one per list item.
#
# - Type: dict
# - Required: No
# - Default: {}
run_sshd_service_settings: {}

# Filename of the drop-in configuration file to be placed in
# `/etc/ssh/sshd_config.d`. Defaults to `00-managed.conf`. The `00-` prefix
# ensures early loading and thus higher precedence over files with
# higher-numbered prefixes.
#
# If a non-default filename is used, any existing
# `/etc/ssh/sshd_config.d/00-managed.conf` from previous Ansible runs will be
# removed automatically to prevent conflicts.
#
# Has to be a plain filename ending in `.conf` (the stock configuration only
# includes `sshd_config.d/*.conf`), starting with an alphanumeric character and
# containing only characters from `A-Za-z0-9._-` (no path separators); the role
# fails during initialization otherwise.
#
# - Type: str
# - Required: No
# - Default: 00-managed.conf
run_sshd_config_service_dropin_file_name: "00-managed.conf"

# If set to `true` (the default), the role runs an access-preservation preflight
# (anti-lockout) before restarting the SSH daemon. It evaluates the effective
# configuration (via `sshd -T`, including resolved `Match` blocks) for the
# account Ansible is connected with and aborts the run *before* the restart
# handler fires if that account would be locked out, for example by a
# restrictive `AllowUsers`, `AllowGroups`, `DenyUsers`, `DenyGroups`,
# `PermitRootLogin no` (when connecting as `root`), or by disabling every
# authentication method.
#
# This guards against the common footgun of applying a syntactically valid but
# too restrictive policy that locks you out on the next login. Set it to `false`
# to bypass the safeguard (only advisable if you are certain you retain another
# way to access the host, e.g. a console).
#
# Note: source-address-based `Match Address`/`Match Host` blocks are evaluated
# against `localhost`/`127.0.0.1` (the connecting client address is not known to
# the role), and only the common access-list glob semantics (`*`, `?`, `!`,
# `user@host`) are honored.
#
# - Type: bool
# - Required: No
# - Default: true
run_sshd_config_access_check: true
