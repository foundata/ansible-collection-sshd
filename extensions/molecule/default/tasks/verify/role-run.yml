# Check collection role "run" outcomes.

- name: "Molecule | Verify | Initialize the foundata.sshd.run role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.sshd.run"
    tasks_from: "init"
    public: true


## Preparation

- name: "Molecule | Verify | Set run_sshd_* and __testing_* variables as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(run_sshd_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | Set other expected or needed facts"
  ansible.builtin.set_fact:
    __run_sshd_config_service_dropin_file_path: >-
      {{ __run_sshd_config_service_dropin_dir_path }}/{{ run_sshd_config_service_dropin_file_name }}
    __testing_journalctl_executable: >-
      {{
        '/bin/journalctl'
        if ((ansible_facts['distribution'] | ansible.builtin.lower) == 'debian' and (ansible_facts['distribution_major_version'] | ansible.builtin.int == 11))
        else '/usr/bin/journalctl'
      }}


## Service drop-in file

- name: "Molecule | Verify | Check if sshd drop-in configuration file exists"
  ansible.builtin.stat:
    path: "{{ __run_sshd_config_service_dropin_file_path }}"
  register: __testing_dropin_file


- name: "Molecule | Verify | Assert sshd drop-in configuration file exists"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file['stat']['exists']
    fail_msg: >-
      The sshd drop-in configuration file '{{ __run_sshd_config_service_dropin_file_path }}'
      does not exist.
    success_msg: >-
      The sshd drop-in configuration file '{{ __run_sshd_config_service_dropin_file_path }}'
      exists.


- name: "Molecule | Verify | Check if default sshd drop-in configuration file does exists (if custom filename is used)"
  ansible.builtin.stat:
    path: "{{ __run_sshd_config_service_dropin_file_path_default }}"
  when:
    - __run_sshd_config_service_dropin_file_path != __run_sshd_config_service_dropin_file_path_default
  register: __testing_dropin_file_default


- name: "Molecule | Verify | Assert default sshd drop-in configuration file does not exists (if custom filename is used)"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file_default['stat']['exists'] is ansible.builtin.false
    fail_msg: >-
      The default sshd drop-in configuration file '{{ __run_sshd_config_service_dropin_file_path_default }}'
      exists (even though a custom filename is used).
    success_msg: >-
      The default sshd drop-in configuration file '{{ __run_sshd_config_service_dropin_file_path_default }}'
      does not exist (valid as custom filename is used).
  when:
    - __run_sshd_config_service_dropin_file_path != __run_sshd_config_service_dropin_file_path_default


## Service state

- name: "Molecule | Verify | Gather service facts"
  ansible.builtin.service_facts:


- name: "Molecule | Verify | Show service facts"
  ansible.builtin.debug:
    var: ansible_facts['services']
    verbosity: 3


- name: "Molecule | Verify | Assert SSH service is running"
  ansible.builtin.assert:
    that:
      - ansible_facts['services'][__run_sshd_sshd_servicename] is ansible.builtin.defined
      - ansible_facts['services'][__run_sshd_sshd_servicename]['state'] == 'running'
    fail_msg: "SSH service '{{ __run_sshd_sshd_servicename }}' is not running"
    success_msg: "SSH service '{{ __run_sshd_sshd_servicename }}' is running"


## Configuration

- name: "Molecule | Verify | Read main sshd config file content"
  ansible.builtin.slurp:
    src: "{{ __run_sshd_config_service_file_path }}"
  register: __testing_sshd_config


- name: "Molecule | Verify | Decode main sshd config file content"
  ansible.builtin.set_fact:
    __testing_sshd_config_content: "{{ __testing_sshd_config['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | Assert some Options are commented out in the default daemon config file"
  ansible.builtin.assert:
    that:
      # Line is commented (allow indentation), then optional spaces after '#',
      # then the directive name as a whole token, then whitespace or EOL.
      - __testing_sshd_config_content is search('(?m)^[\t ]*#[\t ]*AuthorizedKeysFile(?=[\t ]|$)')
      - __testing_sshd_config_content is search('(?m)^[\t ]*#[\t ]*Subsystem(?=[\t ]|$)')
      # Optional: also ensure they are not still active anywhere
      - not (__testing_sshd_config_content is search('(?m)^(?![\t ]*#)[\t ]*AuthorizedKeysFile(?=[\t ]|$)'))
      - not (__testing_sshd_config_content is search('(?m)^(?![\t ]*#)[\t ]*Subsystem(?=[\t ]|$)'))
    fail_msg: >-
      Expected some options to be commented out in {{ __run_sshd_config_service_file_path }}, but one or more
      were not. Ensure the role's commenting logic ran and these directives exist in the file.
    success_msg: >-
      Expected Options are commented out and not present as active directives in
      {{ __run_sshd_config_service_file_path }}.


# Regression tests for sshd_config commenting logic.
# Background: On Fedora 43, the 50-redhat.conf contains a TAB-indented line
# which caused empty strings to enter the options list. When joined with '|',
# this created patterns like 'Port||HostKey' where '||' matches empty strings,
# causing every line to be re-commented on each run (adding '#' repeatedly).
# Self-test first: the detection expression must actually catch a planted
# double-commented line, otherwise the regression assert below is vacuous
# (a broken line split once made it match nothing at all).
- name: "Molecule | Verify | Self-test the double-comment detection with a planted fixture"
  ansible.builtin.assert:
    that:
      - >-
        (('# first' ~ __testing_nl ~ '##Port 22' ~ __testing_nl ~ 'Port 22').splitlines()
         | ansible.builtin.select('ansible.builtin.match', '^##')
         | ansible.builtin.length) == 1
    fail_msg: "The double-comment detection does not catch a planted '##' line; the regression assert below would be vacuous."
    success_msg: "The double-comment detection catches a planted '##' line."
  vars:
    # YAML (not Jinja) escape processing yields the real newline character.
    __testing_nl: "\n"


- name: "Molecule | Verify | Check for double-commented lines in sshd_config"
  # splitlines() on purpose: split('\n') never splits real newlines in this
  # Jinja context (escape sequences are not collapsed), which made this check
  # match nothing at all.
  ansible.builtin.set_fact:
    __testing_double_commented_lines: >-
      {{ (__testing_sshd_config_content).splitlines()
         | ansible.builtin.select('ansible.builtin.match', '^##')
         | ansible.builtin.list }}


- name: "Molecule | Verify | Assert no double-commented lines exist (regex idempotency)"
  ansible.builtin.assert:
    that:
      - __testing_double_commented_lines | ansible.builtin.length == 0
    fail_msg: >-
      Found {{ __testing_double_commented_lines | ansible.builtin.length }} double-commented lines in
      {{ __run_sshd_config_service_file_path }}. This indicates the commenting regex matched
      already-commented lines. Lines: {{ __testing_double_commented_lines[:5] }}
    success_msg: "No double-commented lines found - commenting regex is idempotent"


- name: "Molecule | Verify | Assert Include directive exists and is active"
  ansible.builtin.assert:
    that:
      - __testing_sshd_config_content is search('(?m)^(?![ \t]*#)[ \t]*Include(?=[ \t]|$)')
    fail_msg: >-
      No active 'Include' directive found in {{ __run_sshd_config_service_file_path }}.
    success_msg: >-
      Include directive is present and active in {{ __run_sshd_config_service_file_path }}.


- name: "Molecule | Verify | Extract configured SSH port"
  ansible.builtin.set_fact:
    __testing_configured_ssh_port: >-
      {{
        __run_sshd_effective_sshd_settings['Port'] | ansible.builtin.default(22) | ansible.builtin.int
        if (__run_sshd_effective_sshd_settings is ansible.builtin.defined and
            __run_sshd_effective_sshd_settings['Port'] is ansible.builtin.defined)
        else 22
      }}


- name: "Molecule | Verify | Display configured SSH port"
  ansible.builtin.debug:
    var: __testing_configured_ssh_port
    verbosity: 1


- name: "Molecule | Verify | Set regular expression to search for warnings and errors in the journal"
  ansible.builtin.set_fact:
    __testing_regex_searchwarningerror: '(?i)\b(warning|error|unsupported)'


- name: "Molecule | Verify | Check journal for warnings or errors: sshd"
  ansible.builtin.command:
    argv:
      - "{{ __testing_journalctl_executable }}"
      - '--unit={{ __run_sshd_sshd_servicename | ansible.builtin.regex_replace("\.service$", "*") }}'
  changed_when:
    - false
  failed_when:
    - (__testing_run_journalctlcheck_result['stdout'] is search(__testing_regex_searchwarningerror))
  register: __testing_run_journalctlcheck_result


# ssh-audit (must run after checking the journal for errors, as the audit can
# trigger log entries such as: error: kex_exchange_identification)

- name: "Molecule | Verify | Run ssh-audit against localhost on configured port"
  ansible.builtin.shell: |-
    ssh-audit localhost:{{ __testing_configured_ssh_port | ansible.builtin.int }} -jj > /tmp/ssh-audit-result.json
  args:
    executable: "/bin/bash"
  register: __testing_ssh_audit_run
  changed_when:
    - __testing_ssh_audit_run['rc'] != 1
  failed_when:
    - __testing_ssh_audit_run['rc'] == 1 # other exit codes >0 are reporting SSH config errors


- name: "Molecule | Verify | Read ssh-audit JSON results"
  ansible.builtin.slurp:
    src: "/tmp/ssh-audit-result.json"
  when:
    - __testing_ssh_audit_run is ansible.builtin.defined
    - __testing_ssh_audit_run['rc'] is ansible.builtin.defined
  register: __testing_ssh_audit_json_encoded


- name: "Molecule | Verify | Parse ssh-audit results"
  ansible.builtin.set_fact:
    __testing_ssh_audit_results: "{{ __testing_ssh_audit_json_encoded['content'] | ansible.builtin.b64decode | from_json }}"
  when:
    - __testing_ssh_audit_json_encoded is ansible.builtin.defined
    - __testing_ssh_audit_json_encoded['content'] is ansible.builtin.defined


- name: "Molecule | Verify | Check for CVEs or warnings and failures in recommendations"
  ansible.builtin.set_fact:
    __testing_ssh_audit_cves: "{{ __testing_ssh_audit_results['cves'] | ansible.builtin.default({}) | ansible.builtin.length > 0 }}"
    __testing_ssh_audit_warnings: "{{ __testing_ssh_audit_results['recommendations']['warning'] | ansible.builtin.default({}) | ansible.builtin.length > 0 }}"
    __testing_ssh_audit_failures: "{{ __testing_ssh_audit_results['recommendations']['critical'] | ansible.builtin.default({}) | ansible.builtin.length > 0 }}"
  when:
    - __testing_ssh_audit_results is ansible.builtin.defined
    - __testing_ssh_audit_results['recommendations'] is ansible.builtin.defined


- name: "Molecule | Verify | Assert SSH config is secure"
  ansible.builtin.assert:
    that:
      - __testing_ssh_audit_run is ansible.builtin.defined
      - __testing_ssh_audit_run['rc'] is ansible.builtin.defined
      - not __testing_ssh_audit_cves
      - not __testing_ssh_audit_warnings
      - not __testing_ssh_audit_failures
    fail_msg: "ssh-audit detected issues (CVE, warning or failure) or failed to run. Please check /tmp/ssh-audit-result.json for details."
    success_msg: "ssh-audit verified SSH config with no issues."


## Key exchange negotiability (system client configuration)
#
# The container-based tests connect via "podman exec", so an sshd hardening
# no real SSH client can negotiate stays invisible: the run that APPLIES it
# still works over its established connection, only the next one is locked
# out. This happened with an sntrup761-only KexAlgorithms default (clients
# following the default RHEL 10 / Fedora 43/44 crypto-policies only offer
# the MLKEM hybrid). The check below negotiates with the distribution's OWN ssh client
# honoring the system-wide client configuration - deliberately without -F,
# which would skip /etc/ssh/ssh_config and the crypto-policy include (and
# make a manual test lie). Authentication is expected to fail (no key
# material); only the key exchange matters: "Permission denied" means the
# negotiation worked, "no matching key exchange" is the lockout.

- name: "Molecule | Verify | KEX | Install the OpenSSH client"
  ansible.builtin.package:
    name: "{{ 'openssh-client' if ((ansible_facts['os_family'] | ansible.builtin.lower) == 'debian') else 'openssh-clients' }}"
    state: "present"


- name: "Molecule | Verify | KEX | Determine the client's effective key exchange offer"
  ansible.builtin.command:
    argv: ["ssh", "-G", "-p", "{{ __testing_configured_ssh_port }}", "localhost"]
  register: __testing_kex_client_offer_raw
  changed_when:
    - false


- name: "Molecule | Verify | KEX | Determine the server's effective key exchange list"
  ansible.builtin.command:
    argv: ["{{ __run_sshd_sshd_exec_path }}", "-T", "-f", "{{ __run_sshd_config_service_file_path }}"]
  register: __testing_kex_server_raw
  changed_when:
    - false


# The just-installed client comes from the same OpenSSH build as the server,
# so its algorithm listing reveals whether this platform's sshd knows the
# MLKEM hybrid (sshd itself has no -Q option).
- name: "Molecule | Verify | KEX | List the key exchange algorithms of the local OpenSSH build"
  ansible.builtin.command:
    argv: ["ssh", "-Q", "kex"]
  register: __testing_kex_binary_supported
  changed_when:
    - false


- name: "Molecule | Verify | KEX | Compute the client offer, server list and their intersection"
  ansible.builtin.set_fact:
    __testing_kex_client_offer: >-
      {{
        (__testing_kex_client_offer_raw['stdout_lines'] | ansible.builtin.select('ansible.builtin.match', '^kexalgorithms ')
         | ansible.builtin.first | ansible.builtin.regex_replace('^kexalgorithms ', '')).split(',')
      }}
    __testing_kex_server_list: >-
      {{
        (__testing_kex_server_raw['stdout_lines'] | ansible.builtin.select('ansible.builtin.match', '^kexalgorithms ')
         | ansible.builtin.first | ansible.builtin.regex_replace('^kexalgorithms ', '')).split(',')
      }}


- name: "Molecule | Verify | KEX | Assert the effective server list matches the platform capability"
  ansible.builtin.assert:
    that:
      # the classical-free hybrid every supported platform has
      - "'sntrup761x25519-sha512@openssh.com' in __testing_kex_server_list"
      # MLKEM exactly where the local OpenSSH build supports it - this trips
      # when the static per-platform default (vars/debian_12.yml and friends)
      # no longer matches reality, e.g. after a distribution rebase
      - >-
        ('mlkem768x25519-sha256' in __testing_kex_server_list)
        == ('mlkem768x25519-sha256' in __testing_kex_binary_supported['stdout_lines'])
    fail_msg: >-
      The effective KexAlgorithms ({{ __testing_kex_server_list | ansible.builtin.join(',') }})
      do not match the local OpenSSH build's capability
      ({{ __testing_kex_binary_supported['stdout_lines'] | ansible.builtin.select('ansible.builtin.search', 'mlkem|sntrup') | ansible.builtin.join(',') }}).
    success_msg: "The effective server KEX list matches the platform capability."


- name: "Molecule | Verify | KEX | Notice when the distribution's client policy cannot negotiate at all"
  ansible.builtin.debug:
    msg: >-
      The distribution's default SSH client configuration offers none of the
      server's KEX algorithms (client: {{ __testing_kex_client_offer | ansible.builtin.join(',') }} -
      server: {{ __testing_kex_server_list | ansible.builtin.join(',') }}); the live negotiation
      check is skipped. This is expected on Enterprise Linux 9, whose DEFAULT
      client crypto-policy contains no post-quantum KEX at all.
  when:
    - (__testing_kex_client_offer | ansible.builtin.intersect(__testing_kex_server_list) | ansible.builtin.length) == 0


# The ssh-audit scan above trips the PerSourcePenalties mechanism of
# OpenSSH >= 9.8: sshd then refuses new connections from the scanning source
# ("kex_exchange_identification: read: Connection reset by peer"), which
# would fail the negotiation attempt below for the wrong reason. A restart
# clears the in-memory penalty state (container-verified: without it the
# connection is closed at the banner, with it the attempt reaches
# authentication).
- name: "Molecule | Verify | KEX | Restart sshd to clear the penalty state left by the ssh-audit scan"
  ansible.builtin.service:
    name: "{{ __run_sshd_sshd_servicename }}"
    state: "restarted"


- name: "Molecule | Verify | KEX | Wait until sshd accepts connections again"
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ __testing_configured_ssh_port }}"
    timeout: 30


- name: "Molecule | Verify | KEX | Attempt a real SSH negotiation with the system client configuration"
  ansible.builtin.command:
    argv:
      - "ssh"
      - "-o"
      - "BatchMode=yes"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=15"
      - "-p"
      - "{{ __testing_configured_ssh_port }}"
      - "root@localhost"
      - "true"
  register: __testing_kex_negotiation
  changed_when:
    - false
  # an authentication failure is fine (no key material); anything that is
  # neither success nor "Permission denied" - especially "no matching key
  # exchange method" - is the lockout this check exists for
  failed_when:
    - __testing_kex_negotiation['rc'] != 0
    - not (__testing_kex_negotiation['stderr'] is ansible.builtin.search('Permission denied'))
  when:
    - (__testing_kex_client_offer | ansible.builtin.intersect(__testing_kex_server_list) | ansible.builtin.length) > 0


# OS-specific overwrite verification (text-based)
# Ensures that any key defined in __run_sshd_service_settings_overwrite does not
# appear as an active directive in the sshd_config file content.

- name: "Molecule | Verify | Read drop-in sshd config file content"
  ansible.builtin.slurp:
    src: "{{ __run_sshd_config_service_dropin_file_path }}"
  register: __testing_sshd_dropin_config


- name: "Molecule | Verify | Decode drop-in sshd_config file content"
  ansible.builtin.set_fact:
    __testing_sshd_dropin_config_content: "{{ __testing_sshd_dropin_config['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | Assert overwritten settings to drop (value: null) (if any) are not in sshd_config"
  ansible.builtin.assert:
    that:
      # Match active (not commented) directive: start of line, optional whitespace,
      # NOT a comment, then the directive name followed by whitespace or EOL
      - not (__testing_sshd_dropin_config_content is search('(?mi)^(?![\t ]*#)[\t ]*' ~ item ~ '(?=[\t ]|$)'))
    fail_msg: >-
      Directive '{{ item }}' was found as active in sshd drop-in config but should have
      been removed by __run_sshd_service_settings_overwrite. This OS does not support this
      option or it conflicts with OS-specific requirements.
    success_msg: "Directive '{{ item }}' correctly absent from sshd_config."
  loop: >-
    {{
      __run_sshd_service_settings_overwrite | ansible.builtin.dict2items
      | ansible.builtin.selectattr('value', 'ansible.builtin.in', [none, ''])
      | ansible.builtin.map(attribute='key') | ansible.builtin.list
    }}
  when:
    - __run_sshd_service_settings_overwrite | ansible.builtin.length > 0


- name: "Molecule | Verify | Assert overwritten settings with specific values are present in sshd_config"
  ansible.builtin.assert:
    that:
      # Match active directive with expected value: key followed by whitespace and value
      - >-
        __testing_sshd_dropin_config_content is search(
          '(?mi)^[\t ]*' ~ item['key'] ~ '[\t ]+' ~ (item['value'] | ansible.builtin.string | ansible.builtin.regex_escape) ~ '[\t ]*$'
        )
    fail_msg: >-
      Directive '{{ item['key'] }}' with value '{{ item['value'] }}' was not found in sshd drop-in config
      but should have been set by __run_sshd_service_settings_overwrite.
    success_msg: "Directive '{{ item['key'] }}' correctly set to '{{ item['value'] }}' in sshd_config."
  loop: >-
    {{
      __run_sshd_service_settings_overwrite | ansible.builtin.dict2items
      | ansible.builtin.rejectattr('value', 'ansible.builtin.in', [none, ''])
      | ansible.builtin.list
    }}
  when:
    - __run_sshd_service_settings_overwrite | ansible.builtin.length > 0


# File permissions
#
# This section verifies that the role applies filesystem permissions that match
# both the role's configured variables AND the expected OS package defaults
# as they should be aligned.

- name: "Molecule | Verify | Define symbolic-to-octal mode conversion map"
  ansible.builtin.set_fact:
    __testing_mode_map:
      "u=rw,g=,o=": "0600"
      "u=rw,g=r,o=": "0640"
      "u=rw,g=r,o=r": "0644"
      "u=rwx,g=,o=": "0700"
      "u=rwx,g=x,o=x": "0711"
      "u=rwx,g=rx,o=rx": "0755"
      "u=rx,g=rx,o=rx": "0555"


- name: "Molecule | Verify | Define paths to verify"
  ansible.builtin.set_fact:
    __testing_paths_to_verify:

      - path: "{{ __run_sshd_config_service_file_path }}"
        os_matrix_key: "config_file_mode"
        expected_mode_role: "{{ __run_sshd_config_service_file_mode }}"
        expected_owner: "{{ __run_sshd_config_service_file_owner }}"
        expected_group: "{{ __run_sshd_config_service_file_group }}"

      - path: "{{ __run_sshd_config_service_dropin_dir_path }}"
        os_matrix_key: "config_dropin_dir_mode"
        expected_mode_role: "{{ __run_sshd_config_service_dropin_dir_mode }}"
        expected_owner: "{{ __run_sshd_config_service_dropin_dir_owner }}"
        expected_group: "{{ __run_sshd_config_service_dropin_dir_group }}"

      - path: "{{ __run_sshd_config_service_dropin_file_path }}"
        os_matrix_key: "config_dropin_file_mode"
        expected_mode_role: "{{ __run_sshd_config_service_dropin_file_mode }}"
        expected_owner: "{{ __run_sshd_config_service_dropin_file_owner }}"
        expected_group: "{{ __run_sshd_config_service_dropin_file_group }}"

      - path: "{{ __run_sshd_privseparation_dir_path }}"
        os_matrix_key: "privseparation_mode"
        expected_mode_role: "{{ __run_sshd_privseparation_dir_mode }}"
        expected_owner: "{{ __run_sshd_privseparation_dir_owner }}"
        expected_group: "{{ __run_sshd_privseparation_dir_group }}"

      - path: "{{ __run_sshd_hostkey_rsa_file_path }}"
        os_matrix_key: "hostkey_mode"
        expected_mode_role: "{{ __run_sshd_hostkey_files_mode }}"

      - path: "{{ __run_sshd_hostkey_ecdsa_file_path }}"
        os_matrix_key: "hostkey_mode"
        expected_mode_role: "{{ __run_sshd_hostkey_files_mode }}"

      - path: "{{ __run_sshd_hostkey_ed25519_file_path }}"
        os_matrix_key: "hostkey_mode"
        expected_mode_role: "{{ __run_sshd_hostkey_files_mode }}"


- name: "Molecule | Verify | Stat all paths to verify"
  ansible.builtin.stat:
    path: "{{ item['path'] }}"
  loop: "{{ __testing_paths_to_verify }}"
  loop_control:
    label: "{{ item['path'] }}"
  register: __testing_stat_results
  failed_when: false


- name: "Molecule | Verify | Build platform key for matrix lookup"
  ansible.builtin.set_fact:
    __testing_platform_key: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}"


# Role permissions / match OS package defaults (static matrix)
#
# The static permission matrix below contains known-good values determined by
# installing openssh-server fresh on each OS and recording the default
# permissions.
# Values determined by fresh openssh installation on each distribution+version.
# Keys use distribution name + major version (ansible_facts['distribution_major_version']).
# See prepare/all.yml for instructions on how to update / determine values for
# new OSes.
- name: "Molecule | Verify | Define OS permission matrix"
  ansible.builtin.set_fact:
    __testing_os_permission_matrix:
      # Debian family
      "Debian-12":
        config_file_mode: "0644"
        config_dropin_dir_mode: "0755"
