# Internal role variables specific to: Ubuntu 24.04
#
# Only values specific to the platform and its functionality should be included
# here. Variables in this file override those defined in vars/main.yml.

---

# The OpenSSH version on this platform is older than 9.9 and does not support
# the mlkem768x25519-sha256 hybrid from the collection-wide default, so only
# the sntrup761 hybrid is offered here. This adjusts the role DEFAULT only;
# __run_sshd_service_settings_overwrite would also override a user-supplied
# KexAlgorithms value (see vars/main.yml).
__run_sshd_kex_default: "sntrup761x25519-sha512@openssh.com"
